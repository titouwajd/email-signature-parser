<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Signature Parser</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>📋 Signature Parser</h1>
    <span id="quota-badge" class="badge"></span>
  </header>

  <main>
    <div id="empty-state" class="state-msg" style="display:none">
      <p>📭 Aucun contact extrait.</p>
      <small>Ouvrez un email dans Gmail ou Outlook et cliquez sur "Extraire le contact".</small>
    </div>

    <ul id="contact-list"></ul>
  </main>

  <footer>
    <button id="export-csv" class="btn btn-secondary">📥 Export CSV</button>
    <button id="clear-all" class="btn btn-danger">🗑 Tout effacer</button>
    <div id="premium-cta" style="display:none">
      <p>🔒 Limite : 10 extractions/mois</p>
      <button id="upgrade-btn" class="btn btn-primary">✨ Passer Premium — 5€/mois</button>
      <details id="license-section" style="margin-top:8px;font-size:11px;">
        <summary style="cursor:pointer;color:#9CA3AF;">🔑 J'ai une clé d'activation</summary>
        <div style="display:flex;gap:4px;margin-top:6px;">
          <input id="license-input" type="text" placeholder="Entrez votre clé" style="flex:1;padding:6px 8px;border:1px solid #E5E7EB;border-radius:6px;font-size:12px;">
          <button id="activate-key-btn" class="btn btn-primary" style="padding:6px 12px;font-size:11px;">Activer</button>
        </div>
        <p id="license-msg" style="margin-top:4px;font-size:11px;"></p>
      </details>
    </div>
  </footer>

  <script src="popup.js" type="module"></script>
</body>
</html>
